<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Your Password – Scribbby</title>
  <meta name="description" content="Forgot your password? No stress. Enter your email and we'll sort it out." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="canonical" href="https://scribbby.com/forgot-password" />
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="fonts/fonts.css">
  <style>
    * { box-sizing: border-box; }
    body {
      background: var(--color-bg);
      max-width: 24rem;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    h1 { font-size: 1.25rem; margin-bottom: 1.5rem; }
    label { display: block; margin-bottom: 0.25rem; font-weight: 500; }
    input[type="password"] {
      width: 100%;
      padding: 0.5rem 0.75rem;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin-bottom: 1rem;
    }
    button {
      width: 100%;
      padding: 0.5rem 1rem;
      font-size: 1rem;
      background: #111;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { background: #333; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .message { font-size: 0.9rem; margin-top: 0.5rem; }
    .message.error { color: #c00; }
    .message.success { color: #080; }
    .link { margin-top: 1rem; font-size: 0.9rem; }
    .link a { color: #06c; }
  </style>
</head>
<body>
  <h1>Set new password</h1>
  <p id="invalidLink" class="message error" style="display: none;">This link is invalid or has expired. Request a new one from your <a href="/account">account page</a>.</p>
  <form id="form" style="display: none;">
    <label for="password">New password</label>
    <input type="password" id="password" name="password" required minlength="6" autocomplete="new-password" placeholder="At least 6 characters">
    <label for="confirm">Confirm password</label>
    <input type="password" id="confirm" name="confirm" required minlength="6" autocomplete="new-password" placeholder="Same again">
    <button type="submit" id="btn">Set password</button>
  </form>
  <p id="message" class="message" aria-live="polite"></p>
  <p class="link"><a href="/login">Back to log in</a></p>

  <script type="module">
    const form = document.getElementById('form');
    const invalidLink = document.getElementById('invalidLink');
    const messageEl = document.getElementById('message');
    const btn = document.getElementById('btn');

    function showMessage(text, type = '') {
      messageEl.textContent = text || '';
      messageEl.className = 'message' + (type ? ' ' + type : '');
      messageEl.style.display = text ? 'block' : 'none';
    }

    const configRes = await fetch('/api/config');
    const { supabaseUrl, supabaseAnonKey } = await configRes.json();
    const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2');
    const supabase = createClient(supabaseUrl, supabaseAnonKey);

    // Supabase redirects with #access_token=...&type=recovery; client may set session async
    const hash = window.location.hash || '';
    const isRecovery = hash.includes('type=recovery');

    function showForm() {
      form.style.display = 'block';
      invalidLink.style.display = 'none';
    }

    const { data: { session } } = await supabase.auth.getSession();
    if (isRecovery && session) {
      showForm();
    } else if (isRecovery) {
      const { data: { session: s2 } } = await supabase.auth.getSession();
      if (s2) {
        showForm();
      } else {
        supabase.auth.onAuthStateChange((event, { session: s3 }) => {
          if ((event === 'SIGNED_IN' || event === 'INITIAL_SESSION') && s3) showForm();
        });
        setTimeout(() => {
          if (form.style.display !== 'block') invalidLink.style.display = 'block';
        }, 2000);
      }
    } else {
      invalidLink.style.display = 'block';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = form.password.value;
      const confirm = form.confirm.value;
      if (password !== confirm) {
        showMessage('Passwords do not match.', 'error');
        return;
      }
      if (password.length < 6) {
        showMessage('Password must be at least 6 characters.', 'error');
        return;
      }
      showMessage('');
      btn.disabled = true;
      try {
        const { error } = await supabase.auth.updateUser({ password });
        if (error) throw error;
        showMessage('Password updated. Redirecting…', 'success');
        window.setTimeout(() => {
          window.location.href = '/account';
        }, 1500);
      } catch (err) {
        showMessage(err.message || 'Could not update password.', 'error');
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
